{% extends './base.html' %}
{% block main %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- Menú interior horizontal -->
    <nav class="bg-slate-900 rounded-xl shadow-md overflow-hidden">
        <ul class="flex flex-wrap items-center">
            <li class="bg-black/20 px-6 py-4 border-r border-slate-800 text-slate-400 font-semibold text-sm uppercase tracking-wider hidden sm:block">Movimientos</li>
            <li><a href="{{url_for('form')}}" class="flex items-center gap-2 px-5 py-4 text-sm font-semibold transition-all {% if request.path == url_for('form') %}bg-amber-400 text-slate-900 shadow-md{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}"><span class="material-symbols-outlined text-lg">add_circle</span>Registro</a></li>
            <li><a href="{{url_for('manage_movements')}}" class="flex items-center gap-2 px-5 py-4 text-sm font-semibold transition-all {% if request.path == url_for('manage_movements') %}bg-amber-400 text-slate-900 shadow-md{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}"><span class="material-symbols-outlined text-lg">visibility</span>Visualizar</a></li>
            <li><a href="{{url_for('movements_analysis')}}" class="flex items-center gap-2 px-5 py-4 text-sm font-semibold transition-all {% if request.path in [url_for('movements_analysis'), url_for('movements_analysis_filter')] %}bg-amber-400 text-slate-900 shadow-md{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}"><span class="material-symbols-outlined text-lg">analytics</span>Análisis</a></li>
        </ul>
    </nav>

    <!-- Formulario de Filtros -->
    <form action="/movements_analysis_filter" method="POST" class="bg-white rounded-xl shadow-md p-6 border border-slate-200 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
        <div>
            <label for="concepto" class="block text-xs font-bold uppercase text-slate-500 mb-1">Concepto</label>
            <select name="concepto" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#161d2e] text-sm bg-white">
                <option value="TODOS">TODOS</option>
                {% for movement_concept in movements_concept_list_query_results%}
                    <option value="{{ movement_concept.0 }}">{{ movement_concept.0 }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="tipoAbono" class="block text-xs font-bold uppercase text-slate-500 mb-1">Tipo</label>
            <select name="tipoAbono" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#161d2e] text-sm bg-white">
                <option value="TODOS">TODOS</option>
                <option value="T">TARJETA</option>
                <option value="E">EFECTIVO</option>
            </select>
        </div>
        <div>
            <label for="año" class="block text-xs font-bold uppercase text-slate-500 mb-1">Año</label>
            <select name="año" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#161d2e] text-sm bg-white">
                {% for year in existing_movement_years_list_query_results%}
                    <option value="{{ year.0 }}">{{ year.0 }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <button class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-lg transition-colors text-sm shadow" type="submit">Filtrar</button>
        </div>
    </form>

    <!-- Gráfico de Análisis -->
    <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200 flex flex-col items-center justify-center">
        <img src="data:image/png;base64,{{ image_base64 }}" alt="Gráfico de Análisis" class="max-h-[500px] w-auto object-contain">
    </div>
</section>
{% endblock %}
